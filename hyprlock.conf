# =============================================================================
# HYPRLOCK — MINIMAL CLEAN
# =============================================================================

background {
    monitor =
    path = /home/v3nom/Downloads/Wallpapers/Creature.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.2
    brightness = 0.8
    vibrancy = 0.3
    vibrancy_darkness = 0.0
}

general {
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

input-field {
    monitor =
    
    size = 260, 55
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(504C4Bff) #WAL_COLOR4
    inner_color = rgba(08080899) #WAL_BACKGROUND
    font_color = rgba(ffffffff) #WAL_FONT

    fade_on_empty = false
    placeholder_text = <i>Password...</i>

    rounding = 14

    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    
    color = rgba(ffffffff) #WAL_CLOCK

    font_size = 95
    font_family = JetBrainsMono Nerd Font ExtraBold

    position = 0, 140

    halign = center
    valign = center
}

label {
    monitor =
    
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"

    color = rgba(ffffffaa) #WAL_DATE

    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, 70

    halign = center
    valign = center
}
